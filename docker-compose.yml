services:
  sad-db:
    image: postgis/postgis:16-3.4
    container_name: sad-db
    restart: unless-stopped
    profiles:
      - docker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abh_sad}
      POSTGRES_USER: ${POSTGRES_USER:-sad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sad_password_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sad_user} -d ${POSTGRES_DB:-abh_sad}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sad-network

  sad-backend:
    build:
      context: ./backend
    container_name: sad-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-abh_sad}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-}
      CLIMATE_DB_HOST: ${CLIMATE_DB_HOST:-host.docker.internal}
      CLIMATE_DB_PORT: ${CLIMATE_DB_PORT:-5432}
      CLIMATE_DB_NAME: ${CLIMATE_DB_NAME:-abh_sad}
      CLIMATE_DB_USER: ${CLIMATE_DB_USER:-postgres}
      CLIMATE_DB_PASS: ${CLIMATE_DB_PASS:-}
      # Pas de valeur par défaut : une clé JWT faible connue de tous est pire
      # qu'un démarrage en échec. Définir SECRET_KEY dans l'environnement/.env.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquante - definir une cle forte dans l'environnement}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
      SAD_ENABLE_SWAT_ANALYSIS: ${SAD_ENABLE_SWAT_ANALYSIS:-false}
      SAD_ENABLE_INGESTION_API: ${SAD_ENABLE_INGESTION_API:-false}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/sql:/app/sql
      - ./backend/alembic:/app/alembic
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - sad-network

  sad-frontend:
    build:
      context: ./frontend
    container_name: sad-frontend
    restart: unless-stopped
    depends_on:
      - sad-backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010/api/v1}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8010/api/v1}
      VITE_API_PROXY: ${VITE_API_PROXY:-http://sad-backend:8000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - sad_frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - sad-network

networks:
  sad-network:
    driver: bridge

volumes:
  sad_pgdata:
  sad_frontend_node_modules:
